<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Linktree</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="min-h-screen flex items-center justify-center px-4 py-10">

        <div class="w-full max-w-md text-center">

            <!-- FOTO DE PERFIL -->
            <div class="flex justify-center mb-5">
                <img
                    src="https://res.cloudinary.com/dnqlkcaid/image/upload/q_auto/f_auto/v1781108913/ChatGPT_Image_10_de_jun._de_2026_13_27_38_tjuzbz.png"/"
                    alt="Foto de perfil"
                    class="profile-image w-28 h-28 rounded-full object-cover"
                >
            </div>

            <!-- NOME -->
            <h1 class="text-2xl font-bold text-white">
                Lucas Gonçalves
            </h1>

            <!-- @ -->
         

            <!-- DESCRIÇÃO -->
            <p class="text-gray-300 text-sm mt-4 mb-7">
                Desenvolvedor em formação 💻 | ADS
                <br>
                Confira meus projetos e redes sociais.
            </p>

            <!-- LINKS -->
            <div class="space-y-4">

                <!-- INSTAGRAM -->
                <a
                    href="https://www.instagram.com/ilucasszx/"
                    target="_blank"
                    class="link-button"
                >
                   
                    <span>Instagram</span>
                </a>

                <!-- GITHUB -->
                <a
                    href="https://github.com/LucasDev-code0"
                    target="_blank"
                    class="link-button"
                >
                    
                    <span>GitHub</span>
                </a>

                <!-- LINKEDIN -->
                <a
                    href="https://www.linkedin.com/in/lucascoutgc/"
                    target="_blank"
                    class="link-button"
                >
                    
                    <span>LinkedIn</span>
                </a>

                <!-- WHATSAPP -->
                <a
                    href="https://wa.me/5585994391955"
                    target="_blank"
                    class="link-button"
                >
                   
                    <span>Fale comigo no WhatsApp</span>
                </a>

                
            </div>

            <!-- RODAPÉ -->
            <p class="text-gray-400 text-xs mt-8">
                © 2026 Lucas Gonçalves
            </p>

        </div>

    </main>

</body>
</html>
